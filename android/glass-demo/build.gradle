plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shengqiao.app.glassdemo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shengqiao.android.glassdemo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':glass')
    implementation files('../app/libs/hnvisualeffect-11.0.0.134.aar')
}
