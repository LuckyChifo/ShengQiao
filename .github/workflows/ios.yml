# iOS：C 音频核心测试 + 不签名编译（检查能否编译通过）+ 未签名 IPA
# （这份配置还没在 GitHub 上跑过）
name: ios
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: C core simulations
        run: |
          python3 -m pip install --break-system-packages numpy || python3 -m pip install numpy
          python3 ios/CoreTests/test_core.py
      - name: Thread sanitizer stress test
        run: |
          cd ios/CoreTests
          clang -std=c11 -O1 -g -fsanitize=thread stress_threads.c ../ShengQiao/Audio/sq_core.c -o stress
          ./stress
      - name: Build for device (unsigned)
        run: |
          xcodebuild -project ios/ShengQiao.xcodeproj -scheme ShengQiao -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShengQiao.app Payload/
          zip -qry ShengQiao-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShengQiao-unsigned-ipa
          path: ShengQiao-unsigned.ipa
