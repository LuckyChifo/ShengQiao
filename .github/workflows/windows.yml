# Windows：单元测试 + 装 VB-CABLE 后用真实 WASAPI 自检 + 打包 exe
name: windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pc/requirements.txt pyinstaller
      - name: Web player and console script syntax
        run: |
          node --check pc/app/web/player-core.js
          node --check pc/app/web/player.js
          node --check pc/app/web/pc.js
      - name: Jitter buffer simulations
        run: python pc/tests/test_mic_core.py
      - name: Connection, low-latency and codec regression
        shell: pwsh
        run: |
          $tests = @('test_low_latency.py', 'test_connection_settings.py', 'test_opus.py', 'test_ws_reader.py', 'test_device_names.py', 'test_wasapi_output.py')
          foreach ($test in $tests) {
            python "pc/tests/$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: USB (usbmux) tunnel against a fake usbmuxd + fake phone
        run: python pc/tests/test_usb.py
      - name: Noise suppression quality (RNNoise DLL + spectral subtraction)
        run: python pc/tests/test_denoise.py
      - name: Install VB-CABLE and start Windows Audio
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip -OutFile vb.zip
          Expand-Archive vb.zip -DestinationPath vb
          # 先信任驱动发布者证书，静默安装才不会弹窗
          $cat = Get-ChildItem vb -Filter *.cat -Recurse | Select-Object -First 1
          $cert = (Get-AuthenticodeSignature $cat.FullName).SignerCertificate
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('TrustedPublisher', 'LocalMachine')
          $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
          Start-Process -FilePath vb\VBCABLE_Setup_x64.exe -ArgumentList '-i','-h' -Wait
          # 允许托管运行器上的 Python 从虚拟麦克风录音。
          foreach ($hive in @('HKLM', 'HKCU')) {
            $microphone = "$hive\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            reg.exe add $microphone /v Value /t REG_SZ /d Allow /f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            reg.exe add "$microphone\NonPackaged" /v Value /t REG_SZ /d Allow /f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Set-Service -Name Audiosrv -StartupType Automatic
          Restart-Service -Name Audiosrv
          Start-Sleep -Seconds 5
      - name: Real audio self-test (WASAPI loopback + VB-CABLE mic path)
        run: python pc/app/selftest.py --allow-cable-default
      - name: Install FFmpeg for MP3 protocol tests
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command ffmpeg, ffprobe -ErrorAction Stop
      - name: Protocol tests against the real server
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'pc/app/server.py','--no-tray','--no-browser','--source','tone','--mic-out','fake','--debug' -PassThru
          Start-Sleep -Seconds 6
          $key = (Get-Content pc/config.json | ConvertFrom-Json).key
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' } | Select-Object -First 1).IPAddress
          try {
            python pc/tests/test_protocol.py $ip 23333 $key
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python pc/tests/test_denoise_e2e.py $ip 23333 $key
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          }
      - name: Build exe
        run: pyinstaller pc/shengqiao.spec --noconfirm --distpath dist --workpath build
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $p = Start-Process dist/ShengQiao/ShengQiao.exe -ArgumentList '--no-tray','--no-browser','--source','tone','--port','23400' -PassThru
          Start-Sleep -Seconds 8
          try {
            Invoke-WebRequest http://127.0.0.1:23400/pc -UseBasicParsing | Select-Object -ExpandProperty StatusCode
            Invoke-WebRequest http://127.0.0.1:23400/player.js -UseBasicParsing | Select-Object -ExpandProperty StatusCode
            Invoke-WebRequest http://127.0.0.1:23400/player.css -UseBasicParsing | Select-Object -ExpandProperty StatusCode
          } finally {
            Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ShengQiao-Windows-exe
          path: dist/ShengQiao
