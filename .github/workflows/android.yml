name: android
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  jvm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Download HONOR Translucent Component Kit
        run: |
          mkdir -p android/app/libs
          curl --fail --location https://contentplatform-drcn.hihonorcdn.com/developerPlatform/hnvisualeffect-11.0.0.134/hnvisualeffect-11.0.0.134.aar --output android/app/libs/hnvisualeffect-11.0.0.134.aar
          echo "60fda147e308baa57168845d2e6d2ca03c77defc16ab7e73466bec2d42f4d8fc  android/app/libs/hnvisualeffect-11.0.0.134.aar" | sha256sum -c -
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Install PC test-service dependencies
        run: python -m pip install numpy lameenc qrcode zeroconf
      - name: Start isolated PC protocol service
        run: |
          python pc/app/server.py --no-tray --no-browser --no-qr --no-usb --no-bonjour --source tone --mic-out fake --port 23333 --debug > /tmp/shengqiao-android-ci.log 2>&1 &
          echo $! > /tmp/shengqiao-android-ci.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:23333/api/status > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: JVM tests, native builds and lint
        run: |
          chmod +x android/gradlew
          export SQ_TEST_HOST=127.0.0.1
          export SQ_TEST_PORT=23333
          export SQ_TEST_KEY="$(python -c "import json; print(json.load(open('pc/config.json'))['key'])")"
          android/gradlew -p android :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug :glass-demo:assembleDebug --console=plain --no-daemon
      - name: Stop isolated PC protocol service
        if: always()
        run: |
          if test -f /tmp/shengqiao-android-ci.pid; then kill "$(cat /tmp/shengqiao-android-ci.pid)" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ShengQiao-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Download HONOR Translucent Component Kit
        run: |
          mkdir -p android/app/libs
          curl --fail --location https://contentplatform-drcn.hihonorcdn.com/developerPlatform/hnvisualeffect-11.0.0.134/hnvisualeffect-11.0.0.134.aar --output android/app/libs/hnvisualeffect-11.0.0.134.aar
          echo "60fda147e308baa57168845d2e6d2ca03c77defc16ab7e73466bec2d42f4d8fc  android/app/libs/hnvisualeffect-11.0.0.134.aar" | sha256sum -c -
      - name: Install native build components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented audio tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: bash android/gradlew -p android :app:connectedDebugAndroidTest --console=plain --no-daemon
